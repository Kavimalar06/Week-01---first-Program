<!DOCTYPE html>
<html>

<head>

<title>Online Railway Reservation</title>

<style>

body{
font-family:Arial;
margin:0;
text-align:center;
background-image:url("https://images.unsplash.com/photo-1474487548417-781cb71495f3");
background-size:cover;
background-position:center;
background-attachment:fixed;
}

/* white overlay */
body::before{
content:"";
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(255,255,255,0.8);
z-index:-1;
}

/* header */

header{
background:navy;
color:white;
padding:20px;
font-size:28px;
font-weight:bold;
}

/* booking card */

.container{
width:420px;
margin:40px auto;
background:white;
padding:25px;
border-radius:10px;
box-shadow:0 0 20px rgba(0,0,0,0.3);
}

label{
display:block;
text-align:left;
margin-top:10px;
font-weight:bold;
}

input,select{
width:100%;
padding:10px;
margin-top:5px;
border-radius:5px;
border:1px solid gray;
}

button{
margin-top:15px;
width:100%;
padding:12px;
background:green;
color:white;
border:none;
font-size:16px;
font-weight:bold;
border-radius:6px;
cursor:pointer;
transition:0.3s;
}

button:hover{
background:darkgreen;
transform:scale(1.05);
}

/* ticket preview */

.ticket{
display:none;
width:420px;
margin:20px auto;
background:#fff3cd;
padding:20px;
border-radius:10px;
box-shadow:0 0 15px rgba(0,0,0,0.3);
font-weight:bold;
}

/* payment box */

.payment{
display:none;
width:420px;
margin:20px auto;
background:#d4edda;
padding:20px;
border-radius:10px;
box-shadow:0 0 15px rgba(0,0,0,0.3);
}

/* moving train */

.train{
position:fixed;
bottom:10px;
left:-300px;
font-size:40px;
animation:trainMove 12s linear infinite;
}

@keyframes trainMove{

0%{ left:-300px; }

100%{ left:110%; }

}

</style>

<script>

function previewTicket(){

let from=document.getElementById("from").value;
let to=document.getElementById("to").value;
let date=document.getElementById("date").value;
let seats=document.getElementById("seats").value;
let cls=document.getElementById("class").value;

if(from=="" || to=="" || date=="" || seats=="")
{
alert("Please fill all details");
return;
}

document.getElementById("ticket").style.display="block";

document.getElementById("ticket").innerHTML=
"🎫 Ticket Preview <br><br>"+
"From: "+from+"<br>"+
"To: "+to+"<br>"+
"Date: "+date+"<br>"+
"Seats: "+seats+"<br>"+
"Class: "+cls+"<br><br>"+
"<button onclick='showPayment()'>Proceed to Payment</button>";

}

function showPayment(){

document.getElementById("payment").style.display="block";

}

function payNow(){

alert("💳 Payment Successful!\n\n🚆 Ticket Booked Successfully!");

}

</script>

</head>

<body>

<header>
🚆 ONLINE RAILWAY RESERVATION SYSTEM
</header>

<div class="container">

<h2>Ticket Booking</h2>

<label>From Station</label>
<input type="text" id="from">

<label>To Station</label>
<input type="text" id="to">

<label>Journey Date</label>
<input type="date" id="date">

<label>No of Seats</label>
<input type="number" id="seats">

<label>Class</label>
<select id="class">
<option>Sleeper</option>
<option>AC 3 Tier</option>
<option>AC 2 Tier</option>
<option>First Class</option>
</select>

<button onclick="previewTicket()">
Preview Ticket
</button>

</div>

<div id="ticket" class="ticket"></div>

<div id="payment" class="payment">

<h3>💳 Payment Page</h3>

<label>Card Number</label>
<input type="text">

<label>Card Holder Name</label>
<input type="text">

<label>CVV</label>
<input type="password">

<button onclick="payNow()">Pay Now</button>

</div>

<div class="train">
🚆🚃🚃🚃🚃
</div>

</body>

</html>
