<!DOCTYPE html>
<html>

<head>

<title>Passenger Reservation Record</title>

<style>

body{
font-family:Arial;
margin:0;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
background:url("https://images.unsplash.com/photo-1474487548417-781cb71495f3") no-repeat center/cover;
}

body::before{
content:"";
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.6);
z-index:-1;
}

.card{
width:460px;
padding:30px;
border-radius:12px;
background:rgba(255,255,255,0.2);
backdrop-filter:blur(10px);
box-shadow:0 0 25px rgba(0,0,0,0.4);
animation:slideIn 2s ease;
}

h2{
text-align:center;
color:#00ffff;
animation:glowText 2s infinite alternate;
}

table{
width:100%;
margin-top:20px;
border-collapse:collapse;
background:white;
}

td{
padding:12px;
border:1px solid #ccc;
}

.label{
font-weight:bold;
background:#e6f2ff;
width:40%;
}

button{
margin-top:20px;
width:100%;
padding:12px;
background:#28a745;
color:white;
border:none;
font-size:16px;
border-radius:6px;
cursor:pointer;
}

button:hover{
background:#1f8a36;
}

#message{
margin-top:15px;
font-weight:bold;
color:yellow;
text-align:center;
}

@keyframes slideIn{
from{
transform:translateY(-80px);
opacity:0;
}
to{
transform:translateY(0);
opacity:1;
}
}

@keyframes glowText{
from{
color:#00ffff;
text-shadow:0 0 10px cyan;
}
to{
color:#ffcc00;
text-shadow:0 0 20px yellow;
}
}

.train{
position:fixed;
bottom:10px;
left:-300px;
font-size:40px;
animation:trainMove 12s linear infinite;
}

@keyframes trainMove{
0%{ left:-300px; }
100%{ left:110%; }
}

</style>

<script>

function confirmReservation(){
document.getElementById("message").innerHTML=
"🎫 Reservation Confirmed! Have a pleasant journey 🚆";
}

</script>

</head>

<body>

<div class="card">

<h2>🚆 Passenger Reservation Record</h2>

<table>

<tr>
<td class="label">Passenger Name</td>
<td>Kavimalar</td>
</tr>

<tr>
<td class="label">Train Name</td>
<td>Nilgiri Mountain Express</td>
</tr>

<tr>
<td class="label">From</td>
<td>Chennai</td>
</tr>

<tr>
<td class="label">To</td>
<td>Bangalore</td>
</tr>

<tr>
<td class="label">Seat Number</td>
<td>B2 - 21</td>
</tr>

<tr>
<td class="label">Journey Date</td>
<td>12 May 2026</td>
</tr>

</table>

<button onclick="confirmReservation()">Confirm Reservation</button>

<div id="message"></div>

</div>

<div class="train">🚆🚃🚃🚃🚃</div>

</body>
</html>
